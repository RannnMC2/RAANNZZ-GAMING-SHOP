version: '3.8'
services:
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
